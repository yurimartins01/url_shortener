services:
    db:
        image: postgres:18
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

        ports:
            - "${POSTGRES_PORT}:5432"

        volumes:
            - db-data:/var/lib/postgresql

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s

        restart: unless-stopped

volumes:
    db-data:
